[package]
name = "ferriscope"
description = "A Rust port of gamescope: a headless streaming compositor, as a library and a binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["cli"]
# CPU PPM frame recorder and a text input control socket, for the `ferriscope`
# binary and the integration tests. Embedders leave it off.
test-support = []
# The `ferriscope` binary and its dependencies. Embedders use
# `default-features = false` to get the library alone.
cli = ["test-support", "dep:clap", "dep:tracing-subscriber"]

[[bin]]
name = "ferriscope"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
# `bitflags` is required by the code generated for the protocol's `arm_flag` /
# `trigger_flag` bitfields. Already in the tree (via smithay/wayland-server).
bitflags = "2"
smithay.workspace = true
thiserror.workspace = true
tracing.workspace = true
clap = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
# `gamescope_action_binding_manager` server bindings (`action_binding`). The
# 0.31 `wayland-scanner` line exposes code generation only as proc macros, so it
# is a normal (compile-time proc-macro) dependency, not a build-dependency;
# `wayland-server` and `bitflags` are the same instances smithay
# already resolves, so no new crate enters the tree.
wayland-scanner = "0.31"
wayland-server = "0.31"
wayland-backend = "0.3"

[package.metadata.cargo-machete]
# Used only by the code `wayland-scanner`'s macros generate, which machete does
# not see.
ignored = ["bitflags", "wayland-backend"]

[dev-dependencies]
# The integration tests need the recorder output and control socket.
ferriscope = { path = ".", features = ["test-support"] }
# Native Wayland test client for the focus and capture tests. Test-only; the
# product never links a Wayland client. Pinned to the wayland-* line smithay
# uses (client 0.31 / protocols 0.32, both on wayland-backend 0.3).
tracing-subscriber.workspace = true
# RandR client for the XRandR-emulation test; already in the tree via smithay.
x11rb = { version = "0.13", features = ["randr", "xinput"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["ferriscope-wsi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "BSD-2-Clause"
repository = "https://github.com/hgaiser/ferriscope"

[workspace.dependencies]

# Command-line parsing.
clap = { version = "4.6.1", features = ["derive"] }
# Core library errors: exhaustive, typed, no allocation on the happy path.
thiserror = "2.0"
# Logging.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }


# Compositor foundation (replaces the wlroots fork gamescope is built on).
# Pinned to a git revision: the APIs used here are not in a release yet.
#
# Feature set is trimmed to the sink path: a Wayland compositor with
# one GL renderer and a GBM/dmabuf allocator. `backend_gbm` implies `backend_drm`.
# No DRM/udev/seat/libinput backends, no Vulkan, no multi-GPU renderer.
smithay = { git = "https://github.com/Smithay/smithay", rev = "0ff00983b6007257a7a161a4fe8b14a778e2ac8f", default-features = false, features = [
	"backend_egl",
	"backend_gbm",
	"renderer_gl",
	"desktop",
	"wayland_frontend",
	"xwayland",
	"x11rb_event_source",
] }

[workspace.lints.rust]
dead_code = "deny"
